name: make voices
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/edge_voices.json"]
permissions:
  contents: write
concurrency: voices
jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install edge-tts==7.0.2
      - run: python -c "import edge_tts, asyncio; print(asyncio.run(edge_tts.list_voices())[:1])" 2>&1 | tail -3 > net_check.txt; mkdir -p audio/_samples; cp net_check.txt audio/_samples/net_check.txt
        continue-on-error: true
      - run: python tools/make_voices_edge.py . 2>&1 | tee voices_log.txt
        continue-on-error: true
      - name: commit
        if: always()
        run: |
          mkdir -p audio/_samples && tail -c 20000 voices_log.txt > audio/_samples/log.txt || true
          git config user.name "voice-bot"
          git config user.email "actions@github.com"
          git add -A audio
          git commit -m "Generate voices with Edge TTS ($(jq -r .job tools/edge_voices.json))" || echo "nothing to commit"
          git pull --rebase -q origin main
          git push origin HEAD:main
