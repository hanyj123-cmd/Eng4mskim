name: make voices (ElevenLabs)
on:
  workflow_dispatch:
    inputs:
      job:
        description: "sample = 맛보기, full = 상대방 말(6명), std = 기본 목소리(내가 하는 말·대답 → 단어·예문 순, 한 번에 약 5,300자까지)"
        required: true
        default: sample
        type: choice
        options: [sample, full, std]
permissions:
  contents: write
concurrency: voices
jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: which ffmpeg || (sudo apt-get update -qq || true; sudo apt-get install -y -qq ffmpeg)
      - name: make voices
        env:
          JOB: ${{ inputs.job }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 tools/make_voices_eleven.py . 2>&1 | tee eleven_log.txt
        continue-on-error: true
      - name: commit
        if: always()
        run: |
          tail -c 20000 eleven_log.txt > tools/eleven_log.txt || true
          git config user.name "voice-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain audio)" ]; then
            python3 -c "import re;s=open('sw.js',encoding='utf-8').read();s=re.sub(r\"eng-mom-v(\\d+)\",lambda m:'eng-mom-v'+str(int(m.group(1))+1),s,count=1);open('sw.js','w',encoding='utf-8').write(s)"
            git add sw.js
          fi
          git add -A audio tools/eleven_log.txt
          if [ -f tools/eleven_done.json ]; then git add tools/eleven_done.json; fi
          git commit -m "Generate voices with ElevenLabs (${{ inputs.job }})" || echo "nothing to commit"
          git pull --rebase -q origin main
          git push origin HEAD:main
